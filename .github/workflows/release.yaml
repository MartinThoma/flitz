# Publish a new release when a version tag (e.g. 0.0.8) is pushed.
#
# This workflow assumes that there is a REL-commit which already has a
# git tag. The tag message body (Markdown) becomes the GitHub release notes.
# Hence the CHANGELOG is already adjusted and it's decided what should be in
# the release. This workflow only ensures the release is done with the proper
# contents and that it's announced with a GitHub release.
#
# Publishing uses PyPI Trusted Publishing, so no API token is needed. It has
# to be configured once on https://pypi.org/manage/project/flitz/settings/publishing/
# with: owner "MartinThoma", repository "flitz", workflow "release.yaml",
# environment "pypi".
name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Build
        run: uv build

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ ! -f "dist/flitz-${TAG}.tar.gz" ]; then
            echo "::error::Tag ${TAG} does not match the version in flitz/_version.py"
            ls dist
            exit 1
          fi

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI 🚀
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flitz/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release 🚀
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # actions/checkout doesn't fetch the annotated tag object
          git fetch --tags --force
          git tag -l "${TAG}" --format='%(contents:body)' > release-notes.md
          if [ -s release-notes.md ] && grep -q '[^[:space:]]' release-notes.md; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "${TAG}" dist/* \
            --verify-tag \
            --title "Version ${TAG}, $(date +'%Y-%m-%d')" \
            "${notes[@]}"
