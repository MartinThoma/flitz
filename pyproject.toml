[build-system]
build-backend = "flit_core.buildapi"
requires = [
  "flit-core>=3.12,<4",
]

[project]
name = "flitz"
description = "Fast Location / Indexing / Traversal Zone."
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
maintainers = [ { name = "Martin Thoma", email = "info@martin-thoma.de" } ]
authors = [ { name = "Martin Thoma", email = "info@martin-thoma.de" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Desktop Environment :: File Managers",
  "Typing :: Typed",
]
dynamic = [
  "version",
]
dependencies = [
  "pillow",
  "pydantic>=2",
  "pyside6>=6.8",
  "pyyaml",
]
urls."Bug Reports" = "https://github.com/MartinThoma/flitz/issues"
urls.Changelog = "https://github.com/MartinThoma/flitz/blob/main/CHANGELOG.md"
urls.Documentation = "https://flitz.readthedocs.io/en/latest/"
urls.Source = "https://github.com/MartinThoma/flitz"
scripts.flitz = "flitz.cli:entry_point"

[dependency-groups]
dev = [
  "pre-commit",
  { include-group = "lint" },
  { include-group = "test" },
]
test = [
  "pytest",
]
docs = [
  "myst-parser",
  "sphinx",
  "sphinx-rtd-theme",
]
lint = [
  "mypy",
  "ruff",
  "types-pyyaml",
]

[tool.ruff]
line-length = 88
lint.select = [ "ALL" ]
lint.ignore = [
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in `**kwargs`
  "COM812",  # missing-trailing-comma: conflicts with the formatter
  "CPY001",  # Missing copyright notice: The LICENSE file is enough
  "D107",    # 'Missing docstring in `__init__`' - I'd rather document on class level
  "D203",    # one-blank-line-before-class
  "D212",    # I want multiline-docstrings to start at the second line
  "D407",    # DashedUnderlineAfterSection
  "D413",    # Missing blank line after last section: conflicts with D407
  "DTZ006",  # 'The use of `datetime.datetime.fromtimestamp()` without `tz` argument is not allowed': We don't have a timezone
  "E731",    # Do not assign a `lambda` expression, use a `def`
  "FBT001",  # 'Boolean-typed positional argument in function definition'
  "FBT002",  # Boolean default positional argument in function definition
  "PLC0415", # import-outside-top-level: used to avoid circular imports
  "PLW2901", # `for` loop variable `...` overwritten by assignment target
  "PTH",     # we work with non-standard paths in a lot of places (project-specific)
  "RET504",  # 'Unnecessary assignment to `new_name` before `return` statement': Helps to clarify
]
lint.per-file-ignores."cli.py" = [ "T201" ]
lint.per-file-ignores."docs/*" = [ "A001", "D100", "INP001", "PTH100" ]
lint.per-file-ignores."file_explorer.py" = [ "FBT003" ]
lint.per-file-ignores."tests/*" = [ "ANN", "INP001", "S101" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.mypy]
files = [ "flitz" ]

[tool.pytest]
testpaths = [ "tests" ]
